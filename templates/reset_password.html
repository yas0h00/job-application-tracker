<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Job Application Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background: linear-gradient(135deg, #78350f 0%, #b45309 100%); }
        .auth-card::before { background: linear-gradient(90deg, #f97316, #fb923c, #fdba74); }
        .auth-header h1 { background: linear-gradient(135deg, #f97316, #fb923c, #fdba74); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .btn-primary { background: linear-gradient(135deg, #f97316, #fb923c); box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4); }
        .btn-primary:hover { box-shadow: 0 6px 25px rgba(249, 115, 22, 0.6); }
        .form-group input:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.2); }
        .bg-circle:nth-child(1) { background: radial-gradient(circle, #f97316, transparent); }
        .bg-circle:nth-child(2) { background: radial-gradient(circle, #fb923c, transparent); }
        .bg-circle:nth-child(3) { background: radial-gradient(circle, #fdba74, transparent); }
        .cursor { border-color: #f97316 !important; }
        .cursor-follower { border-color: #fb923c !important; }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <div class="animated-bg"><div class="bg-circle"></div><div class="bg-circle"></div><div class="bg-circle"></div></div>
    <div class="loading-overlay" id="loadingOverlay"><div class="spinner" style="border-top-color: #f97316;"></div></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset Your Password</h1>
                <p>Enter your new password below</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
            <form class="auth-form" method="POST" id="resetForm">
                <div class="form-group"><label for="password">New Password</label><input type="password" id="password" name="password" placeholder="Enter new password" required minlength="8" autofocus></div>
                <div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required></div>
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>
        </div>
    </div>
    <script>
const cursor=document.querySelector('.cursor'),follower=document.querySelector('.cursor-follower');let mouseX=0,mouseY=0,cursorX=0,cursorY=0,followerX=0,followerY=0;document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});function animateCursor(){cursorX+=(mouseX-cursorX)*.3;cursorY+=(mouseY-cursorY)*.3;cursor.style.left=cursorX+'px';cursor.style.top=cursorY+'px';followerX+=(mouseX-followerX)*.1;followerY+=(mouseY-followerY)*.1;follower.style.left=followerX+'px';follower.style.top=followerY+'px';requestAnimationFrame(animateCursor)}animateCursor();document.querySelectorAll('a,button,input,.form-group').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'))});document.getElementById('resetForm').addEventListener('submit',function(e){if(document.getElementById('password').value!==document.getElementById('confirmPassword').value){e.preventDefault();alert('Passwords do not match!');return}document.getElementById('loadingOverlay').classList.add('active')});
    </script>
</body>
</html>
