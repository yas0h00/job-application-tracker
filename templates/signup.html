<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Job Application Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #083344 0%, #0e7490 100%);
        }
        
        .auth-card::before {
            background: linear-gradient(90deg, #06b6d4, #22d3ee, #67e8f9);
        }
        
        .auth-header h1 {
            background: linear-gradient(135deg, #06b6d4, #22d3ee, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #22d3ee);
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
        }
        
        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(6, 182, 212, 0.6);
        }
        
        .form-group input:focus { border-color: #06b6d4; box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.2); }
        .bg-circle:nth-child(1) { background: radial-gradient(circle, #06b6d4, transparent); }
        .bg-circle:nth-child(2) { background: radial-gradient(circle, #22d3ee, transparent); }
        .bg-circle:nth-child(3) { background: radial-gradient(circle, #67e8f9, transparent); }
        
        .cursor { border-color: #06b6d4 !important; }
        .cursor-follower { border-color: #22d3ee !important; }
        .auth-footer a { color: #22d3ee; }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <div class="animated-bg"><div class="bg-circle"></div><div class="bg-circle"></div><div class="bg-circle"></div></div>
    <div class="loading-overlay" id="loadingOverlay"><div class="spinner" style="border-top-color: #06b6d4;"></div></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Join Us Today</h1>
                <p>Create your account and start your journey</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
            <form class="auth-form" method="POST" action="{{ url_for('signup') }}" id="signupForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group"><label for="firstName">First Name</label><input type="text" id="firstName" name="firstName" placeholder="John" required></div>
                    <div class="form-group"><label for="lastName">Last Name</label><input type="text" id="lastName" name="lastName" placeholder="Doe" required></div>
                </div>
                <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" required></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Strong password" required minlength="8"></div>
                <div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required></div>
                <label class="checkbox-label"><input type="checkbox" id="terms" name="terms" required><span>I agree to Terms and Privacy Policy</span></label>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
            <div class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></div>
        </div>
    </div>
    <script>
const cursor=document.querySelector('.cursor'),follower=document.querySelector('.cursor-follower');let mouseX=0,mouseY=0,cursorX=0,cursorY=0,followerX=0,followerY=0;document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});function animateCursor(){cursorX+=(mouseX-cursorX)*.3;cursorY+=(mouseY-cursorY)*.3;cursor.style.left=cursorX+'px';cursor.style.top=cursorY+'px';followerX+=(mouseX-followerX)*.1;followerY+=(mouseY-followerY)*.1;follower.style.left=followerX+'px';follower.style.top=followerY+'px';requestAnimationFrame(animateCursor)}animateCursor();document.querySelectorAll('a,button,input,.form-group').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'))});document.getElementById('signupForm').addEventListener('submit',function(e){if(document.getElementById('password').value!==document.getElementById('confirmPassword').value){e.preventDefault();alert('Passwords do not match!');return}document.getElementById('loadingOverlay').classList.add('active')});
    </script>
</body>
</html>
