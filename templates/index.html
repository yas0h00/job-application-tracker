<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Job Application Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background: linear-gradient(135deg, #14532d 0%, #166534 100%); }
        .dashboard-nav { background: var(--surface); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 2rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); position: relative; }
        .dashboard-nav::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #16a34a, #22c55e, #4ade80); }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #16a34a, #22c55e); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3); }
        .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .user-info { display: flex; align-items: center; gap: 1rem; }
        .greeting h2 { font-size: 1.5rem; margin-bottom: 0.25rem; background: linear-gradient(135deg, #16a34a, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .nav-actions { display: flex; gap: 1rem; }
        .btn-logout { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .stat-card::before { background: linear-gradient(90deg, #16a34a, #22c55e); }
        .add-application h2 { background: linear-gradient(135deg, #16a34a, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .btn-primary { background: linear-gradient(135deg, #16a34a, #22c55e); box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4); }
        .cursor { border-color: #16a34a !important; }
        .cursor-follower { border-color: #22c55e !important; }
        .bg-circle:nth-child(1) { background: radial-gradient(circle, #16a34a, transparent); }
        .bg-circle:nth-child(2) { background: radial-gradient(circle, #22c55e, transparent); }
        .bg-circle:nth-child(3) { background: radial-gradient(circle, #4ade80, transparent); }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <div class="animated-bg"><div class="bg-circle"></div><div class="bg-circle"></div><div class="bg-circle"></div></div>
    
    <div class="container">
        <nav class="dashboard-nav">
            <div class="nav-top">
                <div class="user-info">
                    <div class="user-avatar">{{ current_user.first_name[0] }}{{ current_user.last_name[0] }}</div>
                    <div class="greeting">
                        <h2>Welcome, {{ current_user.first_name }}!</h2>
                        <p>Track your job applications</p>
                    </div>
                </div>
                <div class="nav-actions">
                    <a href="{{ url_for('logout') }}" class="btn btn-logout">Logout</a>
                </div>
            </div>
        </nav>

        <div class="stats" id="stats">
            <div class="stat-card hover-block"><h3>Total</h3><div class="stat-number" id="totalApps">0</div></div>
            <div class="stat-card hover-block"><h3>Interviews</h3><div class="stat-number" id="interviews">0</div></div>
            <div class="stat-card hover-block"><h3>Offers</h3><div class="stat-number" id="offers">0</div></div>
            <div class="stat-card hover-block"><h3>Success</h3><div class="stat-number" id="successRate">0%</div></div>
        </div>

        <section class="add-application">
            <h2>Add Application</h2>
            <form id="applicationForm" class="auth-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group"><label for="company">Company *</label><input type="text" id="company" required placeholder="Google"></div>
                    <div class="form-group"><label for="position">Position *</label><input type="text" id="position" required placeholder="Engineer"></div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group"><label for="dateApplied">Date *</label><input type="date" id="dateApplied" required></div>
                    <div class="form-group"><label for="status">Status *</label><select id="status" required><option value="Applied">Applied</option><option value="Phone Screen">Phone Screen</option><option value="Interview Scheduled">Interview</option><option value="Interviewed">Interviewed</option><option value="Offer">Offer</option><option value="Rejected">Rejected</option><option value="Withdrawn">Withdrawn</option></select></div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group"><label for="location">Location</label><input type="text" id="location" placeholder="Remote / SF"></div>
                    <div class="form-group"><label for="salary">Salary</label><input type="text" id="salary" placeholder="$120k"></div>
                </div>
                <div class="form-group"><label for="notes">Notes</label><textarea id="notes" placeholder="Notes..."></textarea></div>
                <button type="submit" class="btn btn-primary">Add Application</button>
            </form>
        </section>

        <section class="applications-list">
            <div class="list-header">
                <h2>Applications</h2>
                <div class="filters">
                    <select id="filterStatus"><option value="">All</option><option value="Applied">Applied</option><option value="Phone Screen">Phone</option><option value="Interview Scheduled">Interview</option><option value="Interviewed">Interviewed</option><option value="Offer">Offer</option><option value="Rejected">Rejected</option><option value="Withdrawn">Withdrawn</option></select>
                    <input type="text" id="searchCompany" placeholder="Search...">
                </div>
            </div>
            <div class="applications-container" id="applicationsContainer"><div class="empty-state"><p>No applications yet!</p></div></div>
        </section>
    </div>

    <script>
const cursor=document.querySelector('.cursor'),follower=document.querySelector('.cursor-follower');let mouseX=0,mouseY=0,cursorX=0,cursorY=0,followerX=0,followerY=0;document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});function animateCursor(){cursorX+=(mouseX-cursorX)*.3;cursorY+=(mouseY-cursorY)*.3;cursor.style.left=cursorX+'px';cursor.style.top=cursorY+'px';followerX+=(mouseX-followerX)*.1;followerY+=(mouseY-followerY)*.1;follower.style.left=followerX+'px';follower.style.top=followerY+'px';requestAnimationFrame(animateCursor)}animateCursor();document.querySelectorAll('a,button,input,select,textarea,.stat-card').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'))});let applications=[];function loadApplications(){fetch('/api/applications').then(res=>res.json()).then(data=>{applications=data;renderApplications();updateStats()})}function updateStats(){const total=applications.length;const interviews=applications.filter(a=>['Phone Screen','Interview Scheduled','Interviewed'].includes(a.status)).length;const offers=applications.filter(a=>a.status==='Offer').length;const successRate=total>0?((offers/total)*100).toFixed(1):0;document.getElementById('totalApps').textContent=total;document.getElementById('interviews').textContent=interviews;document.getElementById('offers').textContent=offers;document.getElementById('successRate').textContent=successRate+'%'}function renderApplications(){const container=document.getElementById('applicationsContainer');const filterStatus=document.getElementById('filterStatus').value;const searchTerm=document.getElementById('searchCompany').value.toLowerCase();let filtered=applications.filter(app=>{const matchesStatus=!filterStatus||app.status===filterStatus;const matchesSearch=!searchTerm||app.company.toLowerCase().includes(searchTerm);return matchesStatus&&matchesSearch});if(filtered.length===0){container.innerHTML='<div class="empty-state"><p>No applications found.</p></div>';return}container.innerHTML=filtered.map(app=>`<div class="application-card hover-block"><div class="card-header"><div><h3>${app.company}</h3><div class="position">${app.position}</div></div><span class="status-badge status-${app.status.toLowerCase().replace(' ','-')}">${app.status}</span></div><div class="card-body"><div class="info-row"><span class="label">Date:</span><span>${app.date_applied}</span></div>${app.location?`<div class="info-row"><span class="label">Location:</span><span>${app.location}</span></div>`:''}${app.salary?`<div class="info-row"><span class="label">Salary:</span><span>${app.salary}</span></div>`:''}${app.notes?`<div class="info-row notes"><span class="label">Notes:</span><span>${app.notes}</span></div>`:''}</div><div class="card-actions"><button class="btn-icon" onclick="deleteApplication(${app.id})"><svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg></button></div></div>`).join('')}document.getElementById('applicationForm').addEventListener('submit',async(e)=>{e.preventDefault();const data={company:document.getElementById('company').value,position:document.getElementById('position').value,dateApplied:document.getElementById('dateApplied').value,status:document.getElementById('status').value,location:document.getElementById('location').value,salary:document.getElementById('salary').value,notes:document.getElementById('notes').value};const res=await fetch('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(res.ok){e.target.reset();loadApplications()}});async function deleteApplication(id){if(!confirm('Delete?'))return;await fetch(`/api/applications/${id}`,{method:'DELETE'});loadApplications()}document.getElementById('filterStatus').addEventListener('change',renderApplications);document.getElementById('searchCompany').addEventListener('input',renderApplications);loadApplications();
    </script>
</body>
</html>
