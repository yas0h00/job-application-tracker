<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Job Application Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background: linear-gradient(135deg, #881337 0%, #be123c 100%); }
        .auth-card::before { background: linear-gradient(90deg, #f43f5e, #fb7185, #fda4af); }
        .auth-header h1 { background: linear-gradient(135deg, #f43f5e, #fb7185, #fda4af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .btn-primary { background: linear-gradient(135deg, #f43f5e, #fb7185); box-shadow: 0 4px 20px rgba(244, 63, 94, 0.4); }
        .btn-primary:hover { box-shadow: 0 6px 25px rgba(244, 63, 94, 0.6); }
        .form-group input:focus { border-color: #f43f5e; box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.2); }
        .bg-circle:nth-child(1) { background: radial-gradient(circle, #f43f5e, transparent); }
        .bg-circle:nth-child(2) { background: radial-gradient(circle, #fb7185, transparent); }
        .bg-circle:nth-child(3) { background: radial-gradient(circle, #fda4af, transparent); }
        .cursor { border-color: #f43f5e !important; }
        .cursor-follower { border-color: #fb7185 !important; }
        .auth-footer a { color: #fb7185; }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <div class="animated-bg"><div class="bg-circle"></div><div class="bg-circle"></div><div class="bg-circle"></div></div>
    <div class="loading-overlay" id="loadingOverlay"><div class="spinner" style="border-top-color: #f43f5e;"></div></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Forgot Password?</h1>
                <p>No worries! Enter your email for a reset link</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
            <form class="auth-form" method="POST" action="{{ url_for('forgot_password') }}" id="forgotForm">
                <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" placeholder="you@example.com" required></div>
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </form>
            <div class="auth-footer">Remember your password? <a href="{{ url_for('login') }}">Sign in</a></div>
        </div>
    </div>
    <script>
const cursor=document.querySelector('.cursor'),follower=document.querySelector('.cursor-follower');let mouseX=0,mouseY=0,cursorX=0,cursorY=0,followerX=0,followerY=0;document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});function animateCursor(){cursorX+=(mouseX-cursorX)*.3;cursorY+=(mouseY-cursorY)*.3;cursor.style.left=cursorX+'px';cursor.style.top=cursorY+'px';followerX+=(mouseX-followerX)*.1;followerY+=(mouseY-followerY)*.1;follower.style.left=followerX+'px';follower.style.top=followerY+'px';requestAnimationFrame(animateCursor)}animateCursor();document.querySelectorAll('a,button,input,.form-group').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'))});document.getElementById('forgotForm').addEventListener('submit',()=>document.getElementById('loadingOverlay').classList.add('active'));
    </script>
</body>
</html>
